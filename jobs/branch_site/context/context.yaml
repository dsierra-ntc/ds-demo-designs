---
# Static devices
static_devices:
  - {name: firewall01,  model: PA-3220,     role: Firewall,       platform: PAN-OS,    rack: rack1, position: 30, host: 101, mgmt_interface: management}
  - {name: firewall02,  model: PA-3220,     role: Firewall,       platform: PAN-OS,    rack: rack1, position: 28, host: 102, mgmt_interface: management}
  - {name: opengear01,  model: OM1208-8e,   role: Console Server, platform: Linux,     rack: rack1, position: 25, host: 105, mgmt_interface: net1}

# Switch stack template - one per member in the stack
switch:
  model: C9300-48P-A
  role: Access Switch
  platform: Cisco IOS
  rack: rack1
  mgmt_interface: MGT
  vc_name: stack
  # Positions and hosts for each potential stack member (up to 10)
  positions: [27, 26, 23, 22, 21, 20, 19, 18, 17, 16]
  hosts: [103, 104, 113, 114, 115, 116, 117, 118, 119, 120]
  vc_priorities: [2, 1, 3, 4, 5, 6, 7, 8, 9, 10]

# PDU template
pdu:
  model: AP9570
  role: PDU
  platform: Linux
  rack: rack1
  mgmt_interface: eth1
  # Positions and hosts for each potential PDU (up to 4)
  positions: [24, 23, 22, 21]
  hosts: [106, 107, 108, 109]

access_point:
  model: MR36
  role: Wireless Access Point
  switch: switch01
  first_port: 2
  mgmt_interface: eth1
  first_host: 110   # ap0 gets .110, ap1 .111, ...

cables:
  - {a: {device: firewall01, port: ethernet1/1}, b: {device: switch01, port: Eth1/1}}
  - {a: {device: opengear01, port: sw0p0}, b: {device: switch01, port: Eth1/2}}
  - {a: {device: firewall02, port: ethernet1/1}, b: {device: switch02, port: Eth1/1}}

vlan_sets:
  normal:
    - {vid: 10, name: management, description: "Management",  offset: "0.0.0.0/24"}
    - {vid: 20, name: users,      description: "User access", offset: "0.0.1.0/24"}
    - {vid: 30, name: voice,      description: "Voice",       offset: "0.0.2.0/24"}
  ebc:
    - {vid: 10, name: management, description: "Management",  offset: "0.0.0.0/24"}
    - {vid: 20, name: users,      description: "User access", offset: "0.0.1.0/25"}
    - {vid: 21, name: users_ext,  description: "Extended user access", offset: "0.0.1.128/25"}
    - {vid: 30, name: voice,      description: "Voice",       offset: "0.0.2.0/24"}

# Devices get a primary IP from the named VLAN's prefix, using their `host` value as the last octet.
# Assumes the VLAN offset ends in .0 (e.g. 0.0.0.0/24).
management:
  vlan: management
